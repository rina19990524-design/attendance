<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>勤怠実績一覧</title>
    <link rel="stylesheet"
          th:href="@{/css/admin-attendance.css}">
</head>

<body th:with="isDemoAdmin=${admin.employeeId == 'E0003'}">

<div class="page-container">

    <header class="page-header">

        <div class="company-info">
            <span>会社名：株式会社アテンダンス</span>
            <span class="demo-badge" th:if="${isDemoAdmin}">
                DEMO
            </span>
        </div>

        <div class="header-right">

            <div class="admin-info">
                管理者名：
                <span th:text="${admin.employeeName}">
                    山田太郎
                </span>
            </div>

            <a class="header-home-link" th:href="@{/admin}">
                管理者ホームへ戻る
            </a>

            <form class="logout-form"
                  th:action="@{/logout}"
                  method="post">
                <button class="logout-button" type="submit">
                    ログアウト
                </button>
            </form>

        </div>
    </header>

    <main class="main-content">

        <div class="demo-banner"
             th:if="${isDemoAdmin}"
             role="status">
            <strong>
                デモ管理者としてログインしています
            </strong>
            <p>
                画面の閲覧や検索をお試しいただけます。
                デモアカウントでは、登録・更新・パスワード再設定・申請の承認はできません。
            </p>
        </div>

        <section class="page-title">
            <h1>勤怠実績一覧</h1>
            <p>社員の勤怠状況を確認できます</p>
        </section>

        <section class="search-card">

            <form class="search-form"
                  th:action="@{/admin/attendance}"
                  method="get">

                <div class="search-item">
                    <label for="targetMonth">対象月</label>
                    <input type="month"
                           id="targetMonth"
                           name="targetMonth"
                           th:value="${targetMonth}"
                           required>
                </div>

                <div class="search-item">
                    <label for="departmentId">部署</label>
                    <select id="departmentId" name="departmentId">
                        <option value=""
                                th:selected="${departmentId == null}">
                            すべて
                        </option>
                        <option value="1"
                                th:selected="${departmentId == 1}">
                            営業部
                        </option>
                        <option value="2"
                                th:selected="${departmentId == 2}">
                            総務部
                        </option>
                        <option value="3"
                                th:selected="${departmentId == 3}">
                            人事部
                        </option>
                    </select>
                </div>

                <div class="search-item">
                    <label for="keyword">社員ID・社員名</label>
                    <input type="text"
                           id="keyword"
                           name="keyword"
                           th:value="${keyword}"
                           placeholder="社員IDまたは社員名を入力">
                </div>

                <div class="search-actions">
                    <button class="search-button" type="submit">
                        検索
                    </button>
                    <a class="clear-button"
                       th:href="@{/admin/attendance}">
                        条件をクリア
                    </a>
                </div>

            </form>
        </section>

        <section class="attendance-list-card">

            <div class="list-heading">
                <h2>勤怠実績</h2>
                <span class="result-count"
                      th:text="${attendances != null ? #lists.size(attendances) + '件' : '0件'}">
                    0件
                </span>
            </div>

            <div class="no-data"
                 th:if="${attendances == null or attendances.isEmpty()}">
                該当する勤怠実績はありません。
            </div>

            <div class="table-scroll"
                 th:if="${attendances != null and !attendances.isEmpty()}">

                <table class="attendance-table">
                    <thead>
                    <tr>
                        <th>日付</th>
                        <th>社員ID</th>
                        <th>社員名</th>
                        <th>部署名</th>
                        <th>出勤時刻</th>
                        <th>退勤時刻</th>
                        <th>実働時間</th>
                        <th>状態</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="attendance : ${attendances}">

                        <td th:text="${#temporals.format(attendance.workingDay, 'M月d日')}">
                            9月1日
                        </td>

                        <td th:text="${attendance.employeeId}">
                            E0001
                        </td>

                        <td th:text="${attendance.employeeName}">
                            山田太郎
                        </td>

                        <td th:text="${attendance.departmentName}">
                            営業部
                        </td>

                        <td th:text="${attendance.actualWorkingStartTime != null ? #temporals.format(attendance.actualWorkingStartTime, 'HH:mm') : '--:--'}">
                            09:00
                        </td>

                        <td th:text="${attendance.actualWorkingEndTime != null ? #temporals.format(attendance.actualWorkingEndTime, 'HH:mm') : '--:--'}">
                            18:00
                        </td>

                        <td th:text="${attendance.workingTime != null ? attendance.workingTime : '--:--'}">
                            8時間00分
                        </td>

                        <td class="status-cell">
                            <th:block th:switch="${attendance.status}">

                                <span th:case="'正常'"
                                      class="status-badge status-normal">
                                    正常
                                </span>

                                <span th:case="'勤務中'"
                                      class="status-badge status-working">
                                    勤務中
                                </span>

                                <span th:case="'打刻漏れ'"
                                      class="status-badge status-missing">
                                    打刻漏れ
                                </span>

                                <span th:case="'休日'"
                                      class="status-badge status-holiday">
                                    休日
                                </span>

                                <span th:case="'有給'"
                                      class="status-badge status-paid-leave">
                                    有給
                                </span>

                                <span th:case="'予定'"
                                      class="status-badge status-scheduled">
                                    予定
                                </span>

                                <span th:case="*"
                                      class="status-badge status-other"
                                      th:text="${attendance.status != null ? attendance.status : '未設定'}">
                                    未設定
                                </span>

                            </th:block>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </section>

    </main>
</div>

</body>
</html>
