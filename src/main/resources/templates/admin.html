<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>管理者ホーム</title>

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">
</head>

<body th:with="isDemoAdmin=${employee.employeeId == 'E0003'}">

<div class="page-container">

    <header class="header">

        <div class="company-information">
            <span class="company-name">
                会社名：株式会社アテンダンス
            </span>

            <span class="demo-badge"
                  th:if="${isDemoAdmin}">
                DEMO
            </span>
        </div>

        <div class="admin-information">
            管理者名：
            <span th:text="${employee.employeeName}">
                山田太郎
            </span>
        </div>

        <form class="logout-form"
              th:action="@{/logout}"
              method="post">

            <button class="logout-button"
                    type="submit">
                ログアウト
            </button>

        </form>

    </header>

    <main>

        <div class="demo-banner"
             th:if="${isDemoAdmin}"
             role="status">

            <strong>
                デモ管理者としてログインしています
            </strong>

            <p>
                画面の閲覧や検索をお試しいただけます。
                デモアカウントでは、登録・更新・パスワード再設定・申請の承認はできません。
            </p>

        </div>

        <h1 class="page-title">管理者ホーム</h1>

        <div class="admin-menu">

            <a class="menu-card"
               th:href="@{/admin/users}">

                <span class="menu-category">社員情報</span>
                <span class="menu-title">社員管理</span>

            </a>

            <a class="menu-card"
               th:href="@{/admin/attendance}">

                <span class="menu-category">勤怠確認</span>
                <span class="menu-title">勤怠実績一覧</span>

            </a>

            <a class="menu-card"
               th:href="@{/admin/attendance-requests}">

                <span class="menu-category">承認管理</span>
                <span class="menu-title">勤怠申請</span>

                <span class="request-count">
                    未承認
                    <strong th:text="${attendanceRequestCount}">
                        0
                    </strong>
                    件
                </span>

            </a>

            <a class="menu-card"
               th:href="@{/admin/paid-holiday-requests}">

                <span class="menu-category">承認管理</span>
                <span class="menu-title">有給申請</span>

                <span class="request-count">
                    未承認
                    <strong th:text="${paidHolidayRequestCount}">
                        0
                    </strong>
                    件
                </span>

            </a>

        </div>

    </main>

</div>

</body>
</html>
