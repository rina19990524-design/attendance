<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>社員管理</title>
</head>

<body>

    <!-- 上部 -->
    <header>

        <div>
            <strong>会社名</strong>
            <span>株式会社アテンダンス</span>
        </div>

        <div>
            <strong>管理者名</strong>

            <span th:text="${admin.employeeName}">
                山田太郎
            </span>
        </div>

        <!-- ログアウト用フォーム -->
        <form th:action="@{/logout}"
              method="post">

            <button type="submit">
                ログアウト
            </button>

        </form>

    </header>


    <!-- 画面タイトル -->
    <h1>社員管理</h1>


    <!-- 検索と新規登録 -->
    <div>

        <!-- 検索フォーム -->
        <form th:action="@{/admin/users}"
              method="get">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="社員ID・社員名">

            <button type="submit">
                検索
            </button>

        </form>


        <!-- 新規登録画面へのリンク -->
        <a th:href="@{/admin/users/new}">
            ＋新規登録
        </a>

    </div>


    <!-- 社員一覧タイトル -->
    <h2>社員一覧</h2>


    <!-- 社員一覧 -->
    <div>

        <table border="1">

            <thead>

                <tr>
                    <th>社員ID</th>
                    <th>社員名</th>
                    <th>部署名</th>
                    <th>状態</th>
                    <th>編集</th>
                </tr>

            </thead>


            <tbody>

                <!-- 社員情報を1件ずつ表示 -->
                <tr th:each="employee : ${employees}">

                    <!-- 社員ID -->
                    <td th:text="${employee.employeeId}">
                        E0001
                    </td>


                    <!-- 社員名 -->
                    <td th:text="${employee.employeeName}">
                        山田花子
                    </td>


                    <!-- 部署名 -->
                    <td th:switch="${employee.departmentId}">

                        <span th:case="1">
                            営業部
                        </span>

                        <span th:case="2">
                            総務部
                        </span>

                        <span th:case="3">
                            人事部
                        </span>

                    </td>


                    <!-- 在籍状態 -->
                    <td th:switch="${employee.employeeStatusId}">

                        <span th:case="1">
                            在籍
                        </span>

                        <span th:case="2">
                            退職
                        </span>

                        <span th:case="3">
                            育休
                        </span>

                        <span th:case="4">
                            休職
                        </span>

                    </td>


                    <!-- 編集 -->
                    <td>

                        <a th:href="@{/admin/users/{employeeId}/edit(
                                employeeId=${employee.employeeId}
                            )}">
                            編集
                        </a>

                    </td>

                </tr>


                <!-- 検索結果が0件の場合 -->
                <tr th:if="${#lists.isEmpty(employees)}">

                    <td colspan="5">
                        該当する社員は見つかりませんでした
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- ページ番号：現在は画面表示のみ -->
    <nav>

        <a th:href="@{/admin/users(
                keyword=${keyword},
                page=1
            )}">
            ＜前へ
        </a>

        <a th:href="@{/admin/users(
                keyword=${keyword},
                page=1
            )}">
            1
        </a>

        <a th:href="@{/admin/users(
                keyword=${keyword},
                page=2
            )}">
            2
        </a>

        <a th:href="@{/admin/users(
                keyword=${keyword},
                page=3
            )}">
            3
        </a>

        <a th:href="@{/admin/users(
                keyword=${keyword},
                page=4
            )}">
            4
        </a>

        <a th:href="@{/admin/users(
                keyword=${keyword},
                page=2
            )}">
            次へ＞
        </a>

    </nav>


    <!-- 管理者ホームへ戻る -->
    <div>

        <a th:href="@{/admin}">
            管理者ホームへ戻る
        </a>

    </div>

</body>
</html>
