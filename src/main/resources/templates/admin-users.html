<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>社員管理</title>

    <link rel="stylesheet"
          th:href="@{/css/admin-users.css}">
</head>

<body>
    <div class="page-container">

        <!-- 上部 -->
        <header class="header">

            <!-- 会社名 -->
            <div class="company-information">
                <span class="admin-label">
                    ADMIN
                </span>

                <strong>
                    会社名：
                </strong>

                <span>
                    株式会社アテンダンス
                </span>
            </div>

            <!-- 管理者名 -->
            <div class="administrator-information">
                <strong>
                    管理者名：
                </strong>

                <span th:text="${admin.employeeName}">
                    山田太郎
                </span>
            </div>

            <!-- 右側のボタン -->
			<div class="header-actions">
			
			    <!-- ホームへ戻る：左側 -->
			    <a class="header-home-link"
			       th:href="@{/admin}">
			        ◀ ホームへ戻る
			    </a>
			
			    <!-- ログアウト：右側 -->
			    <form class="logout-form"
			          th:action="@{/logout}"
			          method="post">
			
			        <button class="logout-button"
			                type="submit">
			            ログアウト
			        </button>
			    </form>
			
			</div>
        </header>

        <main>
            <!-- 画面タイトル -->
            <section class="title-section">
                <h1>
                    社員管理
                </h1>

                <p>
                    社員情報の確認・登録・編集を行います
                </p>
            </section>

            <!-- 検索と新規登録 -->
            <section class="operation-section">

                <!-- 検索フォーム -->
                <form class="search-form"
                      th:action="@{/admin/users}"
                      method="get">

                    <label for="keyword">
                        社員検索
                    </label>

                    <div class="search-controls">
                        <input type="text"
                               id="keyword"
                               name="keyword"
                               th:value="${keyword}"
                               placeholder="社員ID・社員名を入力">

                        <button type="submit">
                            検索
                        </button>

                        <a class="clear-button"
                           th:href="@{/admin/users}">
                            クリア
                        </a>
                    </div>
                </form>

                <!-- 新規登録 -->
                <a class="new-user-button"
                   th:href="@{/admin/users/new}">
                    ＋ 新規登録
                </a>
            </section>

            <!-- 社員一覧 -->
            <section class="employee-section">

                <div class="employee-list-header">
                    <h2>
                        社員一覧
                    </h2>

                    <span class="employee-count"
                          th:if="${employees != null}"
                          th:text="${#lists.size(employees) + '件'}">
                        0件
                    </span>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>社員ID</th>
                                <th>社員名</th>
                                <th>部署名</th>
                                <th>状態</th>
                                <th>編集</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- 社員情報 -->
                            <tr th:each="employee : ${employees}">

                                <!-- 社員ID -->
                                <td th:text="${employee.employeeId}">
                                    E0001
                                </td>

                                <!-- 社員名 -->
                                <td th:text="${employee.employeeName}">
                                    山田花子
                                </td>

                                <!-- 部署名 -->
                                <td th:switch="${employee.departmentId}">

                                    <span th:case="1">
                                        営業部
                                    </span>

                                    <span th:case="2">
                                        総務部
                                    </span>

                                    <span th:case="3">
                                        人事部
                                    </span>

                                    <span th:case="*">
                                        ―
                                    </span>
                                </td>

                                <!-- 在籍状態 -->
                                <td th:switch="${employee.employeeStatusId}">

                                    <span class="status-badge status-active"
                                          th:case="1">
                                        在籍
                                    </span>

                                    <span class="status-badge status-retired"
                                          th:case="2">
                                        退職
                                    </span>

                                    <span class="status-badge status-leave"
                                          th:case="3">
                                        育休
                                    </span>

                                    <span class="status-badge status-leave"
                                          th:case="4">
                                        休職
                                    </span>

                                    <span class="status-badge status-unknown"
                                          th:case="*">
                                        ―
                                    </span>
                                </td>

                                <!-- 編集 -->
                                <td>
                                    <a class="edit-button"
                                       th:href="@{/admin/users/{employeeId}/edit(
                                           employeeId=${employee.employeeId}
                                       )}">
                                        編集
                                    </a>
                                </td>
                            </tr>

                            <!-- 検索結果が0件 -->
                            <tr th:if="${#lists.isEmpty(employees)}">
                                <td class="empty-message"
                                    colspan="5">
                                    該当する社員は見つかりませんでした
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- ページ番号 -->
                <nav class="pagination">

                    <a th:href="@{/admin/users(
                        keyword=${keyword},
                        page=1
                    )}">
                        ＜ 前へ
                    </a>

                    <a class="current-page"
                       th:href="@{/admin/users(
                           keyword=${keyword},
                           page=1
                       )}">
                        1
                    </a>

                    <a th:href="@{/admin/users(
                        keyword=${keyword},
                        page=2
                    )}">
                        2
                    </a>

                    <a th:href="@{/admin/users(
                        keyword=${keyword},
                        page=3
                    )}">
                        3
                    </a>

                    <a th:href="@{/admin/users(
                        keyword=${keyword},
                        page=4
                    )}">
                        4
                    </a>

                    <a th:href="@{/admin/users(
                        keyword=${keyword},
                        page=2
                    )}">
                        次へ ＞
                    </a>
                </nav>
            </section>
        </main>
    </div>
</body>

</html>
