<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>有給申請一覧</title>

    <link rel="stylesheet"
          th:href="@{/css/admin-paid-holiday-requests.css}">
</head>

<body>

    <div class="page-container">

        <!-- ========================================
             上部の管理者情報
             ======================================== -->
        <header class="page-header">

            <div class="company-info">
                会社名：株式会社アテンダンス
            </div>

            <div class="header-right">

                <div class="admin-info">
                    管理者名：

                    <span th:text="${admin.employeeName}">
                        山田太郎
                    </span>
                </div>

                <!-- ホームへ戻る -->
                <a class="header-home-link"
                   th:href="@{/admin}">
                    ◀ ホームへ戻る
                </a>

                <!-- ログアウト -->
                <form class="logout-form"
                      th:action="@{/logout}"
                      method="post">

                    <button class="logout-button"
                            type="submit">
                        ログアウト
                    </button>

                </form>

            </div>

        </header>


        <!-- ========================================
             メイン部分
             ======================================== -->
        <main class="main-content">

            <!-- 画面タイトル -->
            <section class="page-title">

                <h1>有給申請一覧</h1>

                <p>
                    社員から申請された有給休暇を確認・承認します
                </p>

            </section>


            <!-- ========================================
                 メッセージ
                 ======================================== -->

            <!-- 承認完了メッセージ -->
            <div class="message success-message"
                 th:if="${message}"
                 th:text="${message}">

                有給申請を承認しました

            </div>


            <!-- エラーメッセージ -->
            <div class="message error-message"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">

                承認する有給申請を選択してください

            </div>


            <!-- ========================================
                 申請が存在しない場合
                 ======================================== -->
            <section class="request-list-card"
                     th:if="${paidHolidayRequests == null
                         or paidHolidayRequests.isEmpty()}">

                <div class="list-heading">

                    <h2>承認待ちの申請</h2>

                    <span class="result-count">
                        0件
                    </span>

                </div>

                <div class="no-data">
                    承認待ちの有給申請はありません。
                </div>

            </section>


            <!-- ========================================
                 有給申請承認フォーム
                 ======================================== -->
            <form class="approval-form"
                  th:if="${paidHolidayRequests != null
                      and !paidHolidayRequests.isEmpty()}"
                  th:action=
                  "@{/admin/paid-holiday-requests/approve-selected}"
                  method="post">

                <section class="request-list-card">

                    <div class="list-heading">

                        <div>

                            <h2>承認待ちの申請</h2>

                            <p class="list-description">
                                内容を確認して承認してください
                            </p>

                        </div>

                        <span class="result-count"
                              th:text="${#lists.size(paidHolidayRequests)
                                  + '件'}">
                            1件
                        </span>

                    </div>


                    <!-- 一括承認 -->
                    <div class="bulk-actions">

                        <button class="bulk-approve-button"
                                type="submit"
                                onclick=
                                "return confirm(
                                    '選択した有給申請を一括承認しますか？'
                                );">

                            選択した申請を一括承認

                        </button>

                    </div>


                    <!-- ========================================
                         有給申請一覧
                         ======================================== -->
                    <div class="table-scroll">

                        <table class="request-table">

                            <thead>

                                <tr>

                                    <!-- 全選択 -->
                                    <th class="select-column">

                                        <label class="select-all-label">

                                            <input id="selectAll"
                                                   class="request-checkbox"
                                                   type="checkbox"
                                                   aria-label=
                                                   "すべての有給申請を選択">

                                            <span>選択</span>

                                        </label>

                                    </th>

                                    <th>社員ID</th>

                                    <th>社員名</th>

                                    <th>部署名</th>

                                    <th>休暇区分</th>

                                    <th>取得日</th>

                                    <th>申請理由</th>

                                    <th>承認</th>

                                </tr>

                            </thead>

                            <tbody>

                                <!-- DBから受け取った申請を表示 -->
                                <tr th:each=
                                    "request : ${paidHolidayRequests}">

                                    <!-- 一括承認用チェックボックス -->
                                    <td class="select-cell">

                                        <input class=
                                               "request-checkbox request-checkbox-item"
                                               type="checkbox"
                                               name="requestIds"
                                               th:value="${request.paidHolidayRequestId}"
                                               aria-label=
                                               "この有給申請を選択">

                                    </td>


                                    <!-- 社員ID -->
                                    <td th:text="${request.employeeId}">
                                        E0001
                                    </td>


                                    <!-- 社員名 -->
                                    <td th:text="${request.employeeName}">
                                        山田太郎
                                    </td>


                                    <!-- 部署名 -->
                                    <td th:text="${request.departmentName}">
                                        営業部
                                    </td>


                                    <!-- 休暇区分 -->
                                    <td>

                                        <span class="holiday-type"
                                              th:text="${request.holidayTypeName}">
                                            1日有給
                                        </span>

                                    </td>


                                    <!-- 取得日 -->
                                    <td class="holiday-date"
                                        th:text="${#temporals.format(
                                            request.holidayDate,
                                            'M月d日'
                                        )}">
                                        9月20日
                                    </td>


                                    <!-- 申請理由 -->
                                    <td class="reason-cell"
                                        th:text="${request.requestReason}">
                                        私用のため
                                    </td>


                                    <!-- 1件承認 -->
                                    <td>

                                        <button class="approve-button"
                                                type="submit"
                                                th:formaction=
                                                "@{/admin/paid-holiday-requests/{requestId}/approve(requestId=${request.paidHolidayRequestId})}"
                                                onclick=
                                                "return confirm(
                                                    'この有給申請を承認しますか？'
                                                );">

                                            承認

                                        </button>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </form>

        </main>

    </div>


    <!-- ========================================
         全選択の処理
         ======================================== -->
    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                /*
                 * 見出しの全選択チェックボックス
                 */
                const selectAll =
                    document.getElementById(
                        "selectAll"
                    );


                /*
                 * 各申請行のチェックボックス
                 */
                const requestCheckboxes =
                    document.querySelectorAll(
                        ".request-checkbox-item"
                    );


                /*
                 * 申請が0件の場合は処理しない
                 */
                if (selectAll === null) {

                    return;
                }


                /*
                 * 見出しのチェックボックスを変更した場合
                 */
                selectAll.addEventListener(
                    "change",
                    function () {

                        requestCheckboxes.forEach(
                            function (checkbox) {

                                checkbox.checked =
                                    selectAll.checked;
                            }
                        );

                        selectAll.indeterminate =
                            false;
                    }
                );


                /*
                 * 各行のチェック状態が変更された場合
                 */
                requestCheckboxes.forEach(
                    function (checkbox) {

                        checkbox.addEventListener(
                            "change",
                            updateSelectAll
                        );
                    }
                );


                /*
                 * 見出しのチェック状態を更新する
                 */
                function updateSelectAll() {

                    const checkedCheckboxes =
                        document.querySelectorAll(
                            ".request-checkbox-item:checked"
                        );

                    const checkedCount =
                        checkedCheckboxes.length;

                    const totalCount =
                        requestCheckboxes.length;


                    /*
                     * 全件チェックされている場合
                     */
                    selectAll.checked =
                        totalCount > 0
                        && checkedCount === totalCount;


                    /*
                     * 一部だけチェックされている場合
                     */
                    selectAll.indeterminate =
                        checkedCount > 0
                        && checkedCount < totalCount;
                }
            }
        );

    </script>

</body>

</html>
