<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ホーム</title>
</head>
<body>

    <h1>株式会社アテンダンス</h1>

    <p>
        社員名：
        <span th:text="${employee.employeeName}">社員名</span>
    </p>

    <p>
        日付：
        <span th:text="${today}">2026年8月19日</span>
    </p>

    <h2 id="currentTime">現在時刻</h2>

    <form th:action="@{/attendance/start}" method="post">
        <button type="submit">出勤</button>
    </form>

    <p>
        出勤時間：
        <span th:text="${actualWorkingStartTime}">--:--</span>
    </p>

    <form th:action="@{/attendance/end}" method="post">
        <button type="submit">退勤</button>
    </form>

    <p>
        退勤時間：
        <span th:text="${actualWorkingEndTime}">--:--</span>
    </p>

    <hr>

    <a th:href="@{/attendance}">勤怠実績一覧</a>
    <a th:href="@{/request}">勤怠修正</a>
    <a th:href="@{/paid-holiday}">有給申請</a>

    <script>
        function updateTime() {
            const now = new Date();

            const time =
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');

            document.getElementById('currentTime').textContent = time;
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
