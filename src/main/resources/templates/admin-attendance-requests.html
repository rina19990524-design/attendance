<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>勤怠申請一覧</title>

</head>

<body>


    <!-- 上部の管理者情報 -->
    <header>

        <div>
            会社名：株式会社アテンダンス
        </div>

        <div>

            管理者名：

            <span th:text="${admin.employeeName}">
            </span>

        </div>


        <!-- ログアウト -->
        <form th:action="@{/logout}"
              method="post">

            <button type="submit">
                ログアウト
            </button>

        </form>

    </header>


    <!-- 画面タイトル -->
    <h1>勤怠申請一覧</h1>


    <!-- 承認完了メッセージ -->
    <p th:if="${message}"
       th:text="${message}">

        承認しました

    </p>


    <!-- エラーメッセージ -->
    <p th:if="${errorMessage}"
       th:text="${errorMessage}">

        承認する申請を選択してください

    </p>


    <!-- 申請が存在しない場合 -->
    <p th:if=
       "${attendanceRequests == null or attendanceRequests.isEmpty()}">

        承認待ちの勤怠申請はありません。

    </p>


    <!--
        勤怠申請承認フォーム

        通常の送信先は一括承認。
        各行の承認ボタンではformactionを使って、
        1件承認用のURLへ送信する。
    -->
    <form th:if=
          "${attendanceRequests != null and !attendanceRequests.isEmpty()}"
          th:action="@{/admin/attendance-requests/approve-selected}"
          method="post">


        <!-- 一括承認ボタン -->
        <div>

            <button type="submit"
                    onclick=
                    "return confirm(
                        '選択した申請を一括承認しますか？'
                    );">

                一括承認

            </button>

        </div>


        <br>


        <!-- 勤怠申請一覧 -->
        <table border="1">

            <thead>

                <tr>

                    <th>
                        選択
                    </th>

                    <th>
                        社員ID
                    </th>

                    <th>
                        社員名
                    </th>

                    <th>
                        部署名
                    </th>

                    <th>
                        変更前
                    </th>

                    <th>
                        変更後
                    </th>

                    <th>
                        申請種別
                    </th>

                    <th>
                        申請理由
                    </th>

                    <th>
                        承認
                    </th>

                </tr>

            </thead>

            <tbody>


                <!-- DBから取得した申請を1件ずつ表示 -->
                <tr th:each=
                    "request : ${attendanceRequests}">


                    <!-- 一括承認で使用するチェックボックス -->
                    <td>

                        <input type="checkbox"
                               name="requestIds"
                               th:value=
                               "${request.attendanceRequestId}">

                    </td>


                    <!-- 社員ID -->
                    <td th:text="${request.employeeId}">
                    </td>


                    <!-- 社員名 -->
                    <td th:text="${request.employeeName}">
                    </td>


                    <!-- 部署名 -->
                    <td th:text="${request.departmentName}">
                    </td>


                    <!-- 変更前 -->
                    <td th:text="${request.beforeTime}">
                    </td>


                    <!-- 変更後 -->
                    <td th:text="${request.afterTime}">
                    </td>


                    <!-- 申請種別 -->
                    <td th:text="${request.requestTypeName}">
                    </td>


                    <!-- 申請理由 -->
                    <td th:text="${request.requestReason}">
                    </td>


                    <!-- 1件承認 -->
                    <td>

                        <button type="submit"
                                th:formaction=
                                "@{/admin/attendance-requests/{requestId}/approve(
                                    requestId=${request.attendanceRequestId}
                                )}"
                                onclick=
                                "return confirm(
                                    'この申請を承認しますか？'
                                );">

                            承認

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </form>


    <hr>


    <!-- 管理者ホームへ戻る -->
    <div>

        <a th:href="@{/admin}">
            管理者ホームへ
        </a>

    </div>

</body>

</html>
