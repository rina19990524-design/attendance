<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>社員登録</title>
    
    <link rel="stylesheet"
      th:href="@{/css/admin-user-new.css}">
      
</head>

<body>

    <!-- 上部 -->
    <header class="header">

        <div class="company-information">
            <p class="company-name">
                会社名：株式会社アテンダンス
            </p>
        </div>

        <div class="admin-information">
            管理者名：
            <span th:text="${admin.employeeName}">
                山田太郎
            </span>
        </div>

        <!-- 右側のボタン -->
        <div class="header-actions">

            <!-- ホームへ戻るを左側に配置 -->
            <a class="header-home-link"
			       th:href="@{/admin}">
			        ◀ ホームへ戻る
            </a>

            <!-- ログアウトを右側に配置 -->
            <form class="logout-form"
                  th:action="@{/logout}"
                  method="post">

                <button class="logout-button"
                        type="submit">
                    ログアウト
                </button>
            </form>

        </div>
    </header>

    <!-- 画面タイトル -->
    <h1 class="page-title">
        社員登録
    </h1>

    <main>

        <!-- 登録完了後 -->
        <section class="registration-result"
                 th:if="${registrationResult != null}">

            <p class="success-message"
               th:text="${message}">
                登録が完了しました。社員IDとパスワードは安全な方法でお伝えください。
            </p>

            <!-- 発行された社員ID -->
            <div class="issued-item">

                <label for="issuedEmployeeId">
                    社員ID
                </label>

                <div class="copy-area">

                    <input id="issuedEmployeeId"
                           type="text"
                           th:value="${registrationResult.employeeId}"
                           readonly>

                    <button class="copy-button"
                            type="button"
                            onclick="copyValue('issuedEmployeeId', '社員ID')">
                        コピー
                    </button>

                </div>
            </div>

            <!-- 発行された初期パスワード -->
            <div class="issued-item">

                <label for="issuedPassword">
                    初期パスワード
                </label>

                <div class="copy-area">

                    <input id="issuedPassword"
                           type="text"
                           th:value="${registrationResult.initialPassword}"
                           readonly>

                    <button class="copy-button"
                            type="button"
                            onclick="copyValue('issuedPassword', '初期パスワード')">
                        コピー
                    </button>

                </div>
            </div>

            <!-- コピー結果 -->
            <p id="copyMessage"
               class="copy-message">
            </p>

            <!-- 登録完了後の操作 -->
            <div class="result-actions">

                <a class="continue-link"
                   th:href="@{/admin/users/new}">
                    続けて新規登録
                </a>

                <a class="users-link"
                   th:href="@{/admin/users}">
                    社員一覧へ
                </a>

            </div>
        </section>

        <!-- 登録前の社員登録フォーム -->
        <form class="registration-form"
              th:if="${registrationResult == null}"
              th:action="@{/admin/users/new}"
              method="post">

            <!-- 社員ID -->
            <div class="form-item">

                <label>
                    社員ID
                </label>

                <span class="automatic-value">
                    登録後に自動発行されます
                </span>

            </div>

            <!-- 初期パスワード -->
            <div class="form-item">

                <label>
                    初期パスワード
                </label>

                <span class="automatic-value">
                    登録後に自動発行されます
                </span>

            </div>

            <!-- 社員名 -->
            <div class="form-item">

                <label for="employeeName">
                    社員名
                </label>

                <input id="employeeName"
                       type="text"
                       name="employeeName"
                       maxlength="100"
                       required>

            </div>

            <!-- 部署 -->
            <div class="form-item">

                <label for="departmentId">
                    部署名
                </label>

                <select id="departmentId"
                        name="departmentId"
                        required>

                    <option value="">
                        選択してください
                    </option>

                    <option value="1">
                        営業部
                    </option>

                    <option value="2">
                        総務部
                    </option>

                    <option value="3">
                        人事部
                    </option>

                </select>
            </div>

            <!-- メールアドレス -->
            <div class="form-item">

                <label for="employeeEmail">
                    メールアドレス
                </label>

                <input id="employeeEmail"
                       type="email"
                       name="employeeEmail"
                       maxlength="100"
                       required>

            </div>

            <!-- 社員タイプ -->
            <div class="form-item">

                <label for="employeeType">
                    社員タイプ
                </label>

                <select id="employeeType"
                        name="employeeType"
                        required>

                    <option value="">
                        選択してください
                    </option>

                    <option value="1">
                        従業員
                    </option>

                    <option value="2">
                        管理者
                    </option>

                </select>
            </div>

            <!-- 入社日 -->
            <div class="form-item">

                <label for="hireDate">
                    入社日
                </label>

                <input id="hireDate"
                       type="date"
                       name="hireDate"
                       required>

            </div>

            <!-- 在籍状況 -->
            <div class="form-item">

                <label for="employeeStatusId">
                    在籍状況
                </label>

                <select id="employeeStatusId"
                        name="employeeStatusId"
                        required>

                    <option value="">
                        選択してください
                    </option>

                    <option value="1">
                        在籍
                    </option>

                    <option value="2">
                        退職
                    </option>

                    <option value="3">
                        育休
                    </option>

                    <option value="4">
                        休職
                    </option>

                </select>
            </div>

            <!-- 登録ボタン -->
            <div class="form-actions">

                <button class="register-button"
                        type="submit">
                    登録
                </button>

                <a class="back-link"
                   th:href="@{/admin/users}">
                    社員一覧へ戻る
                </a>

            </div>
        </form>

    </main>

    <!-- コピー処理 -->
    <script>
        async function copyValue(inputId, itemName) {
            const input =
                document.getElementById(inputId);

            const copyMessage =
                document.getElementById("copyMessage");

            try {
                await navigator.clipboard.writeText(
                    input.value
                );

                copyMessage.textContent =
                    itemName + "をコピーしました";

                copyMessage.classList.remove(
                    "copy-error"
                );
            } catch (error) {
                copyMessage.textContent =
                    "コピーに失敗しました";

                copyMessage.classList.add(
                    "copy-error"
                );
            }
        }
    </script>

</body>
</html>
