<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>社員登録</title>

    <link rel="stylesheet"
          th:href="@{/css/admin-user-new.css}">
</head>

<body th:with="isDemoAdmin=${admin.employeeId == 'E0003'}">

<div class="page-container">

    <header class="header">

        <div class="company-information">

            <span class="company-name">
                会社名：株式会社アテンダンス
            </span>

            <span class="demo-badge"
                  th:if="${isDemoAdmin}">
                DEMO
            </span>

        </div>

        <div class="admin-information">
            管理者名：
            <span th:text="${admin.employeeName}">
                山田太郎
            </span>
        </div>

        <div class="header-actions">

            <a class="header-home-link"
               th:href="@{/admin}">
                管理者ホームへ戻る
            </a>

            <form class="logout-form"
                  th:action="@{/logout}"
                  method="post">

                <button class="logout-button"
                        type="submit">
                    ログアウト
                </button>

            </form>

        </div>

    </header>

    <main>

        <div class="demo-banner"
             th:if="${isDemoAdmin}"
             role="status">

            <strong>
                デモ管理者としてログインしています
            </strong>

            <p>
                画面の閲覧や検索をお試しいただけます。
                デモアカウントでは、登録・更新・パスワード再設定・申請の承認はできません。
            </p>

        </div>

        <h1 class="page-title">社員登録</h1>

        <th:block th:unless="${isDemoAdmin}">

            <section class="registration-result"
                     th:if="${registrationResult != null}">

                <p class="success-message"
                   th:text="${message}">
                    登録が完了しました。
                    社員IDとパスワードは安全な方法でお伝えください。
                </p>

                <div class="issued-item">

                    <label for="issuedEmployeeId">
                        社員ID
                    </label>

                    <div class="copy-area">

                        <input id="issuedEmployeeId"
                               type="text"
                               th:value="${registrationResult.employeeId}"
                               readonly>

                        <button class="copy-button"
                                type="button"
                                onclick="copyValue('issuedEmployeeId', '社員ID')">
                            コピー
                        </button>

                    </div>

                </div>

                <div class="issued-item">

                    <label for="issuedPassword">
                        初期パスワード
                    </label>

                    <div class="copy-area">

                        <input id="issuedPassword"
                               type="text"
                               th:value="${registrationResult.initialPassword}"
                               readonly>

                        <button class="copy-button"
                                type="button"
                                onclick="copyValue('issuedPassword', '初期パスワード')">
                            コピー
                        </button>

                    </div>

                </div>

                <p id="copyMessage"
                   class="copy-message"
                   role="status"
                   aria-live="polite"></p>

                <div class="result-actions">

                    <a class="continue-link"
                       th:href="@{/admin/users/new}">
                        続けて新規登録
                    </a>

                    <a class="users-link"
                       th:href="@{/admin/users}">
                        社員一覧へ
                    </a>

                </div>

            </section>

        </th:block>

        <form class="registration-form"
              th:if="${registrationResult == null or isDemoAdmin}"
              th:action="@{/admin/users/new}"
              method="post">

            <div class="form-item">

                <label>社員ID</label>

                <div class="automatic-value">
                    登録後に自動発行されます
                </div>

            </div>

            <div class="form-item">

                <label>初期パスワード</label>

                <div class="automatic-value">
                    登録後に自動発行されます
                </div>

            </div>

            <div class="form-item">

                <label for="employeeName">社員名</label>

                <input id="employeeName"
                       name="employeeName"
                       type="text"
                       maxlength="100"
                       th:disabled="${isDemoAdmin}"
                       required>

            </div>

            <div class="form-item">

                <label for="departmentId">部署</label>

                <select id="departmentId"
                        name="departmentId"
                        th:disabled="${isDemoAdmin}"
                        required>

                    <option value="">選択してください</option>
                    <option value="1">営業部</option>
                    <option value="2">総務部</option>
                    <option value="3">人事部</option>

                </select>

            </div>

            <div class="form-item">

                <label for="employeeEmail">
                    メールアドレス
                </label>

                <input id="employeeEmail"
                       name="employeeEmail"
                       type="email"
                       maxlength="100"
                       th:disabled="${isDemoAdmin}"
                       required>

            </div>

            <div class="form-item">

                <label for="employeeType">社員タイプ</label>

                <select id="employeeType"
                        name="employeeType"
                        th:disabled="${isDemoAdmin}"
                        required>

                    <option value="">選択してください</option>
                    <option value="1">従業員</option>
                    <option value="2">管理者</option>

                </select>

            </div>

            <div class="form-item">

                <label for="hireDate">入社日</label>

                <input id="hireDate"
                       name="hireDate"
                       type="date"
                       th:disabled="${isDemoAdmin}"
                       required>

            </div>

            <div class="form-item">

                <label for="employeeStatusId">
                    在籍状況
                </label>

                <select id="employeeStatusId"
                        name="employeeStatusId"
                        th:disabled="${isDemoAdmin}"
                        required>

                    <option value="">選択してください</option>
                    <option value="1">在籍</option>
                    <option value="2">退職</option>
                    <option value="3">育休</option>
                    <option value="4">休職</option>

                </select>

            </div>

            <div class="form-actions">

                <button class="register-button"
                        type="submit"
                        th:disabled="${isDemoAdmin}">
                    登録
                </button>

                <a class="back-link"
                   th:href="@{/admin/users}">
                    社員一覧へ戻る
                </a>

            </div>

        </form>

    </main>

</div>

<script>
    async function copyValue(inputId, itemName) {
        const input = document.getElementById(inputId);
        const message = document.getElementById("copyMessage");

        if (input === null) {
            showCopyMessage(
                message,
                "コピー対象が見つかりません",
                true
            );
            return;
        }

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(input.value);
            } else {
                const copied = copyBySelection(input);

                if (!copied) {
                    throw new Error("コピー処理に失敗しました");
                }
            }

            showCopyMessage(
                message,
                itemName + "をコピーしました",
                false
            );
        } catch (error) {
            selectInputValue(input);

            showCopyMessage(
                message,
                "自動コピーできませんでした。選択された文字をコピーしてください",
                true
            );
        }
    }

    function copyBySelection(input) {
        selectInputValue(input);

        const copied = document.execCommand("copy");
        const selection = window.getSelection();

        if (selection !== null) {
            selection.removeAllRanges();
        }

        input.blur();
        return copied;
    }

    function selectInputValue(input) {
        input.focus();
        input.select();
        input.setSelectionRange(0, input.value.length);
    }

    function showCopyMessage(element, message, isError) {
        if (element === null) {
            return;
        }

        element.textContent = message;
        element.classList.toggle("copy-error", isError);
        element.classList.toggle("copy-success", !isError);
    }
</script>

</body>
</html>
